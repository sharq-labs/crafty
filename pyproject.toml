[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-ai-core"
dynamic = ["version"]
description = "Typed scientific computation and bounded discovery platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  # Scientific Core units backend. Lower bound only: the platform must not
  # pin its scientific stack to one machine's resolved versions.
  "pint>=0.23"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "engcore._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["engcore*"]

[tool.pytest.ini_options]
# The project uses a src/ layout. Tests must resolve engcore from the checked-out
# source tree even when the package has not been installed in editable mode.
pythonpath = ["src", "."]
